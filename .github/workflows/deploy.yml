name: Deploy Msite

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS Lightsail
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22

          script: |
            set -e

            cd /home/mdrcindia.com/msite

            echo "Fetching latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm install --no-audit --no-fund

            echo "Loading MySQL settings from PHP config..."
            node scripts/sync-mysql-env-from-php.mjs || true

            echo "Building new version without stopping the live app..."
            sudo rm -rf .next-build .next/types .next/dev/types
            NEXT_DIST_DIR=.next-build npm run build

            echo "Switching to the new build..."
            sudo rm -rf .next-old
            if [ -d .next ]; then
              sudo mv .next .next-old
            fi
            sudo mv .next-build .next
            sudo chown -R ubuntu:ubuntu .next

            echo "Reloading PM2 with zero stop..."
            pm2 reload msite --update-env || pm2 restart msite --update-env

            echo "Removing previous build..."
            sudo rm -rf .next-old

            echo "Deployment completed successfully."
